name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore HelloWorld/HelloWorld.csproj

      - name: Build
        run: dotnet build HelloWorld/HelloWorld.csproj --configuration Release --no-restore

      - name: Run Hello World check
        shell: bash
        run: |
          output="$(dotnet run --project HelloWorld/HelloWorld.csproj --configuration Release --no-build)"
          echo "$output"
          if [[ "$output" != *"Hello, World!"* ]]; then
            echo "ERROR: Expected Hello, World! output."
            exit 1
          fi